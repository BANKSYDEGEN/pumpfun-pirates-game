<!doctype html>
<html><head><meta charset="utf-8"><title>v332 shots</title>
<style>
html,body{margin:0;background:#0b1620;color:#ffcd77;font:22px 'Georgia',serif}
#stage{width:1280px;height:800px;position:relative;overflow:hidden}
canvas{display:block}
.panel{position:absolute;inset:0;display:none;padding:24px;box-sizing:border-box}
.panel.on{display:block}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:20px}
.slot{aspect-ratio:1;border:3px solid #6b4a24;border-radius:14px;background:radial-gradient(#4a3018,#24160a);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.slot.leg{border-color:#ffd24a;box-shadow:0 0 0 2px #ffd24a,0 0 16px rgba(255,205,60,.65)}
.slot img{width:70%;height:70%;object-fit:contain}
.slot span{font-size:14px;color:#f4e2bb}
.slot b{position:absolute;left:6px;bottom:6px;font:bold 12px system-ui;color:#ffcd77;background:rgba(0,0,0,.55);border-radius:6px;padding:0 4px}
h1{margin:0 0 8px;letter-spacing:.06em}
.sub{color:#cdb68c;font-size:16px}
</style></head>
<body>
<div id="stage">
  <div id="p1" class="panel"></div>
  <div id="p2" class="panel"></div>
  <div id="p3" class="panel">
    <h1>INVENTORY · STORAGE</h1>
    <div class="sub">Two navy epic muskets with distinct attachments · legendary thumbs · crafted acc icons</div>
    <div class="grid" id="g"></div>
  </div>
</div>
<script type="importmap">{"imports":{"three":"/vendor/three-0.165.0/build/three.module.min.js","three/addons/":"/vendor/three-0.165.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { zipLines, ZIP } from '/js/dock/zipline.js';
import { H, LAKE, SKULL } from '/js/island/foot.js';
import { accMeshes } from '/js/onfoot/gunAccMesh.js';
import { musketGeo, swordGeo, applyLegendaryOrnament } from '/js/onfoot/swords.js';
import { toon } from '/js/toon.js';

window.__ready = false;
const FM = { H, LAKE, SKULL };
const Z = zipLines(FM);

function mkRenderer(w,h){
  const r = new THREE.WebGLRenderer({ antialias:true, alpha:false, preserveDrawingBuffer:true });
  r.setSize(w,h,false); r.setPixelRatio(1); r.outputColorSpace = THREE.SRGBColorSpace;
  r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.15;
  return r;
}

// ---- Panel 1: zipline overview (top-down + side markers) ----
async function shot1(){
  const w=1280,h=800; const r=mkRenderer(w,h); const scene=new THREE.Scene(); scene.background=new THREE.Color(0x87b7d8);
  scene.add(new THREE.HemisphereLight(0xfff4e0,0x3a4a5a,1.4));
  const key=new THREE.DirectionalLight(0xffffff,1.6); key.position.set(2,5,3); scene.add(key);
  // ground plane sample
  const g=new THREE.Group();
  const mat=new THREE.MeshLambertMaterial({color:0x5a8a4a});
  for(let x=-420;x<=120;x+=8) for(let z=-280;z<=220;z+=8){
    const y=H(x,z); if(y<-2) continue;
    const m=new THREE.Mesh(new THREE.BoxGeometry(7.5, Math.max(0.5,y), 7.5), mat);
    m.position.set(x, y/2, z); g.add(m);
  }
  scene.add(g);
  function stand(x,z,y,col,label){
    const s=new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.6,2.3,8), new THREE.MeshLambertMaterial({color:col}));
    s.position.set(x,y+1.15,z); scene.add(s);
    const flag=new THREE.Mesh(new THREE.BoxGeometry(0.2,1.2,0.6), new THREE.MeshLambertMaterial({color:0xfa0d0d}));
    flag.position.set(x+1.2,y+2.4,z); scene.add(flag);
  }
  stand(Z.skullLine.A[0], Z.skullLine.A[1], Z.skullLine.gA, 0xc9a227, 'wfSkull');
  stand(Z.castleLine.B[0], Z.castleLine.B[1], Z.castleLine.gB, 0xc9a227, 'wfCastle');
  stand(Z.skullLine.B[0], Z.skullLine.B[1], Z.skullLine.gB, 0xffe08a, 'skull');
  stand(CASTLE_X(), CASTLE_Z(), 42, 0xb0b0b0, 'castle');
  function CASTLE_X(){return -395} function CASTLE_Z(){return -57}
  // cables
  function cable(A,B,gA,gB,hA,hB,sag){
    const pts=[]; for(let i=0;i<=40;i++){const t=i/40; const x=A[0]+(B[0]-A[0])*t,z=A[1]+(B[1]-A[1])*t;
      const y=(gA+hA)*(1-t)+(gB+hB)*t - sag*4*t*(1-t); pts.push(new THREE.Vector3(x,y,z));}
    const c=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),64,0.2,5,false), new THREE.MeshLambertMaterial({color:0x2b2622}));
    scene.add(c);
  }
  cable(Z.skullLine.A,Z.skullLine.B,Z.skullLine.gA,Z.skullLine.gB,Z.skullLine.hA,Z.skullLine.hB,Z.skullLine.sag);
  cable(Z.castleLine.A,Z.castleLine.B,Z.castleLine.gA,Z.castleLine.gB,Z.castleLine.hA,Z.castleLine.hB,Z.castleLine.sag);
  const cam=new THREE.PerspectiveCamera(42,w/h,1,2000);
  cam.position.set(-160, 220, -40); cam.lookAt(-180, 40, -160);
  r.render(scene,cam);
  document.getElementById('p1').appendChild(r.domElement);
  document.getElementById('p1').classList.add('on');
  // overlay labels via 2d
  const ov=document.createElement('canvas'); ov.width=w; ov.height=h; ov.style.position='absolute'; ov.style.left=0; ov.style.top=0; ov.style.pointerEvents='none';
  const ctx=ov.getContext('2d'); ctx.fillStyle='rgba(10,10,10,.55)'; ctx.fillRect(16,16,560,150);
  ctx.fillStyle='#ffcd77'; ctx.font='bold 28px Georgia'; ctx.fillText('v332 ZIPLINES · cliff edges + short gantries', 28, 52);
  ctx.font='18px Georgia'; ctx.fillStyle='#fff';
  ctx.fillText(`Skull brow d=${Math.hypot(Z.skullLine.B[0]-90,Z.skullLine.B[1]-188).toFixed(0)}m  h=${Z.skullLine.gB.toFixed(0)}`, 28, 84);
  ctx.fillText(`WF skull ${Z.skullLine.A}  hA=${Z.skullLine.hA.toFixed(2)}  clr=${Z.skullLine.minClr.toFixed(2)}`, 28, 110);
  ctx.fillText(`WF castle ${Z.castleLine.B}  hB=${Z.castleLine.hB.toFixed(2)}  clr=${Z.castleLine.minClr.toFixed(2)}`, 28, 136);
  ctx.fillText(`hang=${ZIP.hang}  all gantries ≤ 2.75`, 28, 158);
  document.getElementById('p1').appendChild(ov);
}

// ---- Panel 2: legendary musket + attachments + legendary sword ----
async function shot2(){
  const w=1280,h=800; const r=mkRenderer(w,h); const scene=new THREE.Scene(); scene.background=new THREE.Color(0x1a0f08);
  scene.add(new THREE.HemisphereLight(0xffe8c0,0x2a1a10,1.2));
  const key=new THREE.DirectionalLight(0xfff0d0,2.2); key.position.set(3,4,2); scene.add(key);
  const rim=new THREE.DirectionalLight(0xffc14a,1.1); rim.position.set(-3,2,-2); scene.add(rim);
  const mat = toon(0xffffff, null, { vertexColors:true, key:'shot-wpn' });
  const musk = new THREE.Mesh(musketGeo('navy'), mat);
  accMeshes(musk, { scope:1, bayonet:1, stock:1, horn:1 }, 'navy');
  applyLegendaryOrnament(musk, 'musket', 'navy', 'legendary');
  musk.rotation.set(-0.15, 0.9, 0.05); musk.position.set(-0.55, 0.05, 0); scene.add(musk);
  const sword = new THREE.Mesh(swordGeo('cutlass'), mat);
  applyLegendaryOrnament(sword, 'sword', 'cutlass', 'legendary');
  sword.rotation.set(0.2, -0.4, 0.15); sword.position.set(0.85, -0.1, 0.2); sword.scale.setScalar(1.15); scene.add(sword);
  const cam=new THREE.PerspectiveCamera(32,w/h,0.05,20);
  cam.position.set(0.2, 0.55, 2.6); cam.lookAt(0.1, 0.15, 0.3);
  r.render(scene,cam);
  const p=document.getElementById('p2'); p.appendChild(r.domElement); p.classList.add('on');
  const ov=document.createElement('canvas'); ov.width=w; ov.height=h; ov.style.position='absolute'; ov.style.left=0; ov.style.top=0;
  const ctx=ov.getContext('2d'); ctx.fillStyle='rgba(10,10,10,.55)'; ctx.fillRect(16,16,620,90);
  ctx.fillStyle='#ffcd77'; ctx.font='bold 28px Georgia'; ctx.fillText('LEGENDARY Navy Musket + all 4 attachments', 28, 52);
  ctx.font='18px Georgia'; ctx.fillStyle='#fff'; ctx.fillText('Scope · Bayonet · Stock · Powder Horn  |  Legendary Cutlass', 28, 82);
  p.appendChild(ov);
}

// ---- Panel 3: inventory UI ----
async function shot3(){
  const items = [
    { img:'/assets/items/wpn_musket_navy_legendary.webp', name:'Navy Musket', pip:'2/4', leg:true },
    { img:'/assets/items/wpn_musket_navy.webp', name:'Navy Musket', pip:'2/4', leg:false },
    { img:'/assets/items/wpn_sword_cutlass_legendary.webp', name:'Cutlass', pip:'', leg:true },
    { img:'/assets/items/wpn_sword_rapier_legendary.webp', name:'Rapier', pip:'', leg:true },
    { img:'/assets/items/val_acc_scope.webp', name:'Brass Scope', pip:'', leg:false },
    { img:'/assets/items/val_acc_bayonet.webp', name:'Bayonet', pip:'', leg:false },
    { img:'/assets/items/val_acc_stock.webp', name:'Stock', pip:'', leg:false },
    { img:'/assets/items/val_acc_horn.webp', name:'Powder Horn', pip:'', leg:false },
  ];
  const g=document.getElementById('g');
  for(const it of items){
    const d=document.createElement('div'); d.className='slot'+(it.leg?' leg':'');
    d.innerHTML=`<img src="${it.img}"><span>${it.name}</span>${it.pip?`<b>${it.pip}</b>`:''}`;
    g.appendChild(d);
  }
  document.getElementById('p3').classList.add('on');
  await Promise.all([...document.querySelectorAll('#g img')].map(img=>img.complete?0:new Promise(r=>{img.onload=img.onerror=r})));
}

window.__shots = { shot1, shot2, shot3, show(n){ for(const p of document.querySelectorAll('.panel')) p.classList.remove('on'); document.getElementById('p'+n).classList.add('on'); } };
await shot1(); await shot2(); await shot3();
document.getElementById('p2').classList.remove('on'); document.getElementById('p3').classList.remove('on');
document.getElementById('p1').classList.add('on');
window.__ready = true;
</script>
</body></html>
