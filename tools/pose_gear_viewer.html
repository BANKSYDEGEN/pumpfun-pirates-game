<style>html,body{margin:0;background:#1d2833;color:#fff;font:600 13px system-ui;overflow:hidden}#lab{position:fixed;inset:0;pointer-events:none}

<script type="module">

  const Z = +(q.get('zoom') || 1);

    const c = Math.cos(k.yaw || 0), sn = Math.sin(k.yaw || 0), vx = V[0] * c + V[2] * sn, vz = -V[0] * sn + V[2] * c;   // views are in the pirate's frame
    const LY = V[3] ?? ly, LX = V[4] ? V[4] * c : 0, LZ = V[4] ? -V[4] * sn : 0; cam.position.set(k.x + LX + vx / Z, LY + (V[1] - 0.95) / Z, LZ + vz / Z); cam.lookAt(k.x + LX, LY, LZ);

const RT = new THREE.WebGLRenderTarget(200, 260), PX = new Uint8Array(200 * 260 * 4), M_C = new THREE.MeshBasicMaterial({ color: 0x00ff00, side: THREE.DoubleSide }), M_B = new THREE.MeshBasicMaterial({ color: 0xff0000, side: THREE.DoubleSide }), M_O = new THREE.MeshBasicMaterial({ color: 0x0000ff, side: THREE.DoubleSide });

  const V = VIEWS[view] || VIEWS.back, c = Math.cos(k.yaw || 0), sn = Math.sin(k.yaw || 0), ly = k.wet ? 0.1 : 0.95, cm = new THREE.PerspectiveCamera(30, 200 / 260, 0.1, 60);
  cm.position.set(k.x + V[0] * c + V[2] * sn, ly + V[1] - 0.95, -V[0] * sn + V[2] * c); cm.lookAt(k.x, ly, 0);
  const bg = k.s.background; k.s.background = null; const hid = []; k.s.children.forEach((o) => { if (o !== k.p.object && o.visible && o.isMesh) { o.visible = false; hid.push(o); } });

}
