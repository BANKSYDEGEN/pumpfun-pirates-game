<!doctype html>
<!-- [Timothy] dev only: bakes the pre-baked gear card PNGs (assets/pirates/thumbs/<slot>_<id>.png) with js/gearThumbs.js, the same
     renderer the shop uses live. tools/gear_thumbs.html?skin=<id>&hatColor=<n> (serve the repo root; tools/gear_bake.py saves them) -->
<html><head><meta charset="utf-8"><base href="../"><title>gear thumbs</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script>
<style>body{margin:0;background:#0e1a20;color:#fff;font:600 12px system-ui}#g{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:6px}#g div{text-align:center}#g img{width:100%;background:radial-gradient(circle at 50% 40%,#2a3a40,#0e1a20);border-radius:6px}</style>
</head><body><div id="g"></div>
<script type="module">
import { gearThumb, thumbStats } from './js/gearThumbs.js';
import { GEAR_ITEMS } from './js/shopCatalog.js';
const q = new URLSearchParams(location.search), o = { skin: q.get('skin') || 'classic', hatColor: +(q.get('hatColor') || 0) };
const out = {}; const t0 = performance.now();
for (const it of GEAR_ITEMS) { const u = await gearThumb(it.slot, it.id, o); out[`${it.slot}_${it.id}`] = u;
  const d = document.createElement('div'); d.innerHTML = `<img src="${u}"><br>${it.label}`; document.getElementById('g').append(d); }
window.BAKE = { out, ms: Math.round(performance.now() - t0), stats: thumbStats };
</script></body></html>
