<!doctype html>
<!-- [Timothy] dev only: Timothy's procedural/Blender gear (js/pirateGear.js) vs Raul's items (js/pirateItems.js) on the same v4 pirate.
     tools/gear_compare.html?lod=hi|lo&clip=idle|steer&view=q|front|back|side|pq&zoom=&ly=&lx= -->
<html><head><meta charset="utf-8"><base href="../"><title>gear compare</title>
<style>html,body{margin:0;background:#1d2833;color:#fff;font:600 13px system-ui;overflow:hidden}#lab{position:fixed;inset:0;pointer-events:none}#lab div{position:absolute;text-align:center;text-shadow:0 1px 2px #000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script>
</head><body><div id="lab"></div>
<script type="module">
import * as THREE from 'three';
import { pirateFigure, tickPirates } from './js/pirates.js';
import { applyGear } from './js/pirateGear.js';
import { equip } from './js/pirateItems.js';
const q = new URLSearchParams(location.search), LOW = q.get('lod') === 'lo', CLIP = q.get('clip') || 'idle', VIEW = q.get('view') || 'q';
const CELLS = JSON.parse(q.get('cells') || 'null') || [
  ['T tricorn', { hat: 'tricorn' }], ['R hat_tricorn', null, 'hat_tricorn'], ['R crown', null, 'crown'],
  ['T hook (R)', { hook: 'hook_iron' }], ['R hook_r', null, 'hook_r'], ['R hook_l', null, 'hook_l'],
  ['T parrot_red', { parrot: 'parrot_red' }], ['R parrot', null, 'parrot'], ['R peg_l', null, 'peg_l'],
  ['T tshirt', { outfit: 'tshirt' }], ['R shirt', null, 'shirt'], ['R peg_r', null, 'peg_r'],
  ['T coat', { outfit: 'coat' }], ['R suit', null, 'suit']];
const COLS = +(q.get('cols') || 7), ROWS = Math.ceil(CELLS.length / COLS);
const R = new THREE.WebGLRenderer({ antialias: !LOW, preserveDrawingBuffer: true }); R.setPixelRatio(1); R.setSize(innerWidth, innerHeight); R.toneMapping = THREE.ACESFilmicToneMapping; R.autoClear = false; document.body.prepend(R.domElement);
const scenes = [], figs = [], done = [];
CELLS.forEach(([name, gear, rid], i) => {
  const s = new THREE.Scene(); s.background = new THREE.Color(0x2a3a4a);
  s.add(new THREE.HemisphereLight(0xdfefff, 0x4a3a2a, 1.6)); const d = new THREE.DirectionalLight(0xfff1dc, 2.2); d.position.set(3, 6, 4); s.add(d);
  const f = pirateFigure({ look: { skin: 0, hair: 0 }, low: LOW, height: 1.75, clip: CLIP, onReady: (p) => { if (rid) equip(p, rid).then(() => done[i] = 1).catch((e) => { console.error(e); done[i] = 1; }); } });
  if (gear) applyGear(f, gear).then(() => done[i] = 1); s.add(f); scenes.push(s); figs.push(f);
  const l = document.createElement('div'); l.textContent = name; document.getElementById('lab').append(l); l.dataset.i = i;
});
const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 50), VIEWS = { front: [0, 1.05, 4.2], back: [0, 1.4, -4.2], q: [2.3, 1.7, 3.4], side: [4.2, 1.1, 0], pq: [3.4, 1.5, 2.6], nq: [-2.6, 1.5, 3.2] };
let t0 = performance.now(), calls = [];
function frame(now) {
  const dt = Math.min(0.05, (now - t0) / 1000); t0 = now; tickPirates(q.get('freeze') ? 0 : dt);
  const w = innerWidth / COLS, h = innerHeight / ROWS; document.querySelectorAll('#lab div').forEach((l) => { const i = +l.dataset.i; l.style.left = (i % COLS) * w + 'px'; l.style.width = w + 'px'; l.style.top = (Math.floor(i / COLS) * h + h - 20) + 'px'; });
  R.setScissorTest(true); R.clear(); cam.aspect = w / h; cam.updateProjectionMatrix();
  const Z = +(q.get('zoom') || 1), LY = +(q.get('ly') || 0.95), LX = +(q.get('lx') || 0); cam.position.set(LX + VIEWS[VIEW][0] / Z, LY + (VIEWS[VIEW][1] - 0.95) / Z, VIEWS[VIEW][2] / Z); cam.lookAt(LX, LY, 0);
  calls = scenes.map((s, i) => { const x = (i % COLS) * w, y = innerHeight - (Math.floor(i / COLS) + 1) * h; R.setViewport(x, y, w, h); R.setScissor(x, y, w, h); R.info.reset(); R.info.autoReset = false; R.render(s, cam); return R.info.render.calls; });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.CMP = { ready: () => CELLS.every((c, i) => done[i] && figs[i].userData.v4), calls: () => calls.slice(),
  tris: () => figs.map((f) => { let t = 0; f.traverse((o) => { if (o.isMesh && o.visible) t += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; }); return Math.round(t); }) };
</script></body></html>
