<!doctype html>
<!-- [Raul] PUMPFUN PIRATES land emote viewer (dev only, not shipped): frame sequences of the procedural emote poses (js/onfoot/emotePose.js)
     on the real loadPirate + foot physics (flat dry ground). tools/emote_viewer.html?lod=hi|lo&sex=m|f&rows=arr,follow,jig,followWalk,arrWalk&cols=6 -->
<html><head><meta charset="utf-8"><base href="../"><title>PUMPFUN PIRATES emote viewer</title>
<style>html,body{margin:0;background:#1d2833;color:#fff;font:600 13px system-ui;overflow:hidden}#lab{position:fixed;inset:0;pointer-events:none}
#lab div{position:absolute;text-align:center;text-shadow:0 1px 2px #000}#hd{position:fixed;left:8px;top:4px;font-size:15px;opacity:.9}</style>
<script type="importmap">{"imports":{"three":"./vendor/three-0.165.0/build/three.module.js","three/addons/":"./vendor/three-0.165.0/examples/jsm/"}}</script>
</head><body><div id="hd"></div><div id="lab"></div>
<script type="module">
import * as THREE from 'three';
import { loadPirate } from './js/onfoot/pirate.js';
import { newBody, placeBody, stepBody, poseBody } from './js/onfoot/physics.js';
import { EMOTE_POSES } from './js/onfoot/emotePose.js';
const q = new URLSearchParams(location.search), LOW = q.get('lod') === 'lo', FEM = q.get('sex') === 'f';
const ROWS = (q.get('rows') || 'arr,follow,boss,help,attack,retreat,gg,jig').split(','), COLS = +(q.get('cols') || 6);
const DRY = { ground: () => 0, water: () => null };
const span = (e, n, i) => e === 7 ? 0.14 + i * 0.28 : 0.08 + i * (EMOTE_POSES[e].dur - 0.16) / (n - 1); // the jig: mid of each half bar (L kick, R kick, ...)
const R = {
  arr:        { label: 'ARR!', e: 0, v: 0 },
  follow:     { label: 'FOLLOW ME!', e: 1, v: 0 },
  jig:        { label: 'YO HO HO!', e: 7, v: 0 },
  boss:       { label: 'BOSS INCOMING!', e: 2, v: 0 },
  help:       { label: 'NEED HELP!', e: 3, v: 0 },
  attack:     { label: 'ATTACK!', e: 4, v: 0 },
  retreat:    { label: 'RETREAT!', e: 5, v: 0 },
  gg:         { label: 'GG', e: 6, v: 0 },
  followWalk: { label: 'FOLLOW ME! walking', e: 1, v: 4.2 },
  arrWalk:    { label: 'ARR! walking', e: 0, v: 4.2 },
};
document.getElementById('hd').textContent = `PUMPFUN PIRATES land emotes · ${FEM ? 'female' : 'male'} · ${LOW ? 'Low (phone)' : 'High (desktop)'}`;
const renderer = new THREE.WebGLRenderer({ antialias: !LOW, preserveDrawingBuffer: true }); renderer.setPixelRatio(1); renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.autoClear = false; document.body.prepend(renderer.domElement);
const cells = [];
ROWS.forEach((rn, r) => { for (let c = 0; c < COLS; c++) {
  const S = R[rn], s = new THREE.Scene(); s.background = new THREE.Color(0x9fc4d8);
  s.add(new THREE.HemisphereLight(0xdfefff, 0x4a3a2a, 1.6)); const d = new THREE.DirectionalLight(0xfff1dc, 2.2); d.position.set(3, 6, 4); s.add(d);
  const g = new THREE.Mesh(new THREE.PlaneGeometry(40, 12), new THREE.MeshLambertMaterial({ color: 0xc9b083 })); g.rotation.x = -Math.PI / 2; s.add(g);
  const p = loadPirate({ look: { skin: (r + c) % 2 ? 0 : 3, hair: 0, female: FEM }, low: LOW }); s.add(p.object);
  const T = span(S.e, COLS, c); cells.push({ rn, S, s, p, g, T, r, c });
  const l = document.createElement('div'); l.textContent = `${S.label} · ${T.toFixed(2)} s`; document.getElementById('lab').append(l); l.dataset.i = cells.length - 1; } });
function sim(cell) { // walk / stand 1 s, fire the emote, run to this cell's time at 1/30 s
  const { S, p, T } = cell, b = newBody(), yaw = S.v ? Math.PI / 2 : +(q.get('yaw') || 0.3), dt = 1 / 30; let x = S.v ? -4 : 0, t = 0, fired = null;
  placeBody(b, DRY, x, 0); const v4 = p.object.userData.v4 || p.object.children.find((o) => o.userData?.v4)?.userData.v4;
  for (let i = 0; i < 400; i++) {
    if (fired === null && t >= 1) { p.emote(S.e); fired = t; }
    x += S.v * dt * Math.cos(0) * (S.v ? 1 : 0); stepBody(b, DRY, x, 0, dt, S.v);
    const st = poseBody(p.object, b, x, 0, yaw, S.v, t); p.update(dt, S.v, st); v4?.update(dt); t += dt;
    if (fired !== null && t >= fired + T) break; }
  cell.x = x; cell.w = p.object.userData.emote?.w ?? 0; }
const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 60);
function layout() { const w = innerWidth / COLS, h = (innerHeight - 24) / ROWS.length;
  document.querySelectorAll('#lab div').forEach((l) => { const i = +l.dataset.i; l.style.left = (i % COLS) * w + 'px'; l.style.width = w + 'px'; l.style.top = (24 + Math.floor(i / COLS) * h + h - 20) + 'px'; }); return { w, h }; }
function render() { const { w, h } = layout(); renderer.setScissorTest(true); renderer.clear(); cam.aspect = w / h; cam.updateProjectionMatrix();
  const Z = +(q.get('zoom') || 1);
  cells.forEach((k, i) => { const x = (i % COLS) * w, y = innerHeight - (24 + (Math.floor(i / COLS) + 1) * h);
    const V = { q: [1.9, 1.1, 5.0], front: [0.9, 0.9, 5.2], side: [0.2, 0.9, 5.4] }[q.get('view') || 'q'];
    cam.position.set(k.x + V[0] / Z, 0.5 + V[1] / Z, V[2] / Z); cam.lookAt(k.x, 1.0, 0);
    renderer.setViewport(x, y, w, h); renderer.setScissor(x, y, w, h); renderer.render(k.s, cam); }); }
const ready = () => cells.every((k) => k.p.object.children.some((o) => o.userData?.v4));
window.EMOV = { ready, go() { cells.forEach(sim); render(); return cells.map((k) => [k.rn, +k.T.toFixed(2), +k.w.toFixed(2)]); }, cells };
</script></body></html>
