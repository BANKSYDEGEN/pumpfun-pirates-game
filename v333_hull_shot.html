<!doctype html>
<html><head>
<meta charset="utf-8"/>
<title>v333 hull shots</title>
<script type="importmap">

{
  "imports": {
    "three": "./vendor/three-0.165.0/build/three.module.min.js",
    "three/addons/": "./vendor/three-0.165.0/examples/jsm/"
  }
}

</script>
<style>
html,body{margin:0;background:#0b1620;color:#ffcd77;font-family:'Just Another Hand',cursive,system-ui;overflow:hidden}
#dk-acts{position:fixed;left:50%;bottom:48px;transform:translateX(-50%);z-index:8;display:flex;gap:10px}
#dk-acts button{font:26px 'Just Another Hand',cursive;letter-spacing:.05em;padding:10px 20px 7px;border-radius:14px;border:3px solid #ffcd77;background:rgba(22,22,22,.86);color:#ffcd77}
#dk-acts button.primary{background:#fa0d0d;color:#fff}
#dk-acts kbd{font:16px system-ui;background:#ffcd77;color:#161616;border-radius:5px;padding:1px 6px;margin-right:8px}
#hs-panel{position:fixed;right:24px;bottom:110px;z-index:64;display:none;align-items:flex-end;justify-content:flex-end;background:transparent;pointer-events:none}
#hs-panel.on{display:flex}
#hs-panel .hs-box{width:min(520px,46vw);box-shadow:0 12px 40px #000;background:linear-gradient(#2a1a0c,#1a1008);border:3px solid #ffcd77;border-radius:16px;padding:14px;pointer-events:auto}
#hs-panel .hs-head{font-size:30px;color:#ffcd77;margin-bottom:8px}
#hs-panel .hs-cols{display:flex;gap:12px}
#hs-panel .hs-col{flex:1;min-height:160px;border:2px dashed rgba(255,205,119,.4);border-radius:10px;padding:8px;font:18px system-ui;color:#e8d4a8}
#c{position:fixed;inset:0;z-index:1}
#tag{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:9;font-size:28px;text-shadow:0 2px 8px #000}
</style></head>
<body>
<div id="tag"></div>
<div id="dk-acts"></div>
<canvas id="c"></canvas>
<div id="hs-panel"><div class="hs-box">
  <div class="hs-head"><span>⚓ CAPTAIN'S CHEST</span></div>
  <div class="hs-cols">
    <div class="hs-col"><h4>🎒 YOUR BACKPACK</h4><div>gold_bar ×2<br>cutlass</div></div>
    <div class="hs-col"><h4>🧰 SHIP CARGO <small>2/12</small></h4><div>gold_bar ×3<br>wpn:sword:cutlass:rare</div></div>
  </div>
</div></div>
<script type="module">
import * as THREE from 'three';
import { buildCaptainsQuartersRoom } from './js/dock/shipHull.js';

const acts = document.getElementById('dk-acts');
const tag = document.getElementById('tag');
const panel = document.getElementById('hs-panel');
let renderer, scene, camera, room;

function setActs(list, label) {
  tag.textContent = label || '';
  acts.innerHTML = '';
  for (const a of list) {
    const b = document.createElement('button');
    if (a.primary) b.classList.add('primary');
    b.innerHTML = (a.key ? `<kbd>${a.key}</kbd>` : '') + a.label;
    acts.appendChild(b);
  }
}
function ensure3() {
  if (renderer) return;
  const canvas = document.getElementById('c');
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.setSize(innerWidth, innerHeight, false);
  renderer.setPixelRatio(1);
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x120c08);
  camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 100);
  room = buildCaptainsQuartersRoom({ low: true });
  scene.add(room);
}
window.__shot = async (mode) => {
  document.getElementById('c').style.visibility = mode === 'interior' ? 'visible' : 'hidden';
  panel.classList.toggle('on', mode === 'interior');
  if (mode === 'dock') setActs([
    { label: 'GO ASHORE', key: 'E', primary: true },
    { label: 'SET SAIL', key: 'W' },
    { label: 'ENTER HULL', key: 'H' },
  ], '⚓ MOORED · HARBOR DOCK');
  if (mode === 'sea') setActs([
    { label: 'ENTER HULL', key: 'E', primary: true },
    { label: 'LAUNCH CANOE', key: 'Q' },
    { label: 'WEIGH ANCHOR', key: 'W' },
  ], '⚓ ANCHORED · OPEN SEA');
  if (mode === 'interior') {
    setActs([
      { label: 'OPEN STORAGE', key: 'E', primary: true },
      { label: 'LEAVE HULL', key: 'Q' },
    ], "⚓ CAPTAIN'S QUARTERS");
    ensure3();
    camera.position.set(2.8, 2.55, 3.6);
    camera.lookAt(-1.0, 1.45, -1.2);
    renderer.render(scene, camera);
    await new Promise(r => setTimeout(r, 250));
    renderer.render(scene, camera);
  }
  return true;
};
window.__ready = true;
</script>
</body></html>
